<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运的交错 - 我的同人作品</title>
    <link rel="preconnect" href="https://fonts.font.im">
    <link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <h1 class="story-title">命运的交错</h1>
    <div style="text-align: center; color: #888; font-size: 0.9em; margin-bottom: 30px;">
        作者：你的笔名 | 字数：3000+ | 状态：已完结
    </div>

    <!-- 正文区域 -->
    <div class="story-content">
        <p>这里是正文的第一段。直接写你的文字，不要带上多余的标签。</p>
        <p>这里是正文的第二段。</p>
        <p>这里是最后一段。</p>
    </div>

    <!-- 上下篇导航 -->
    <div style="display: flex; justify-content: space-between; margin-top: 50px; font-size: 0.9em; border-top: 1px dashed #ddd5c9; padding-top: 30px;">
        <span style="color: #b0a8a0;">已经是第一篇了</span>
        <span style="color: #b0a8a0;">暂无下一篇</span>
    </div>

    <!--  Giscus 评论区占位符（注意：只能有一个，交给 JS 自动生成！） -->
    <div class="giscus-container" style="margin-top: 40px;">
        <div class="giscus-title" style="color: var(--accent-color); font-weight: bold; margin-bottom: 20px;">评论区</div>
        <div id="giscus-container"></div>
    </div>

    <!-- 引入 JS -->
    <script src="../script.js"></script>
        <!-- 悬浮阅读工具栏（直接放在这里，不用 JS 生成了） -->
        </div>
    </div>
</body>
</html>
    <!-- Giscus 评论区容器 -->
    <div class="giscus-container" style="margin-top: 40px;">
        <div class="giscus-title" style="color: var(--accent-color); font-weight: bold; margin-bottom: 20px;">评论区</div>
        <div id="giscus-container"></div>
    </div>

    <!-- 统一的折叠式侧边栏阅读工具 -->
    <div class="sidebar-tool">
        <div class="sidebar-panel" id="sidebar-panel" style="display: none;">
            <div class="sidebar-header">阅读工具</div>
            <div class="tool-item">
                <span class="tool-label">字号</span>
                <div class="tool-btn-group">
                    <button onclick="changeFontSize('small')" id="btn-small">小</button>
                    <button onclick="changeFontSize('medium')" id="btn-medium" class="active">中</button>
                    <button onclick="changeFontSize('large')" id="btn-large">大</button>
                </div>
            </div>
            <div class="tool-item">
                <span class="tool-label">主题</span>
                <button onclick="toggleTheme()" id="theme-btn" class="tool-btn">暗色模式</button>
            </div>
            <div class="tool-item">
                <span class="tool-label">公告</span>
                <button onclick="openAnnouncement()" class="tool-btn">查看</button>
            </div>
        </div>
        <div class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </div>
    </div>

    <!-- 引入 JS（注意：works 文件夹下的文件，路径必须带 ../） -->
    <script src="../script.js"></script>
</body>
</html>
