<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运的交错 - 我的同人作品</title>
    
    <!-- 提前加载思源宋体 -->
    <link rel="preconnect" href="https://fonts.font.im">
    <link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 样式表必须带 ../ -->
    <link rel="stylesheet" href="../style.css">
    
    <!-- 防绕过密码检查 -->
   <script>
    // 检查同人密码
    if (sessionStorage.getItem('fanfic_authenticated') !== 'true') {
        window.location.href = '../index.html';
    }
</script>
</head>
<body>

    <h1 class="story-title">命运的交错</h1>
    <div style="text-align: center; color: #888; font-size: 0.9em; margin-bottom: 30px;">
        作者：你的笔名 | 字数：3000+ | 状态：已完结
    </div>

    <!-- 正文区域 -->
    <div class="story-content">
        <p>这里是正文的第一段。直接写你的文字，不要带上多余的标签。</p>
        <p>这里是正文的第二段。</p>
        <p>这里是最后一段。</p>
    </div
            <!-- 上下篇导航 -->
    <div style="display: flex; justify-content: space-between; margin-top: 50px; font-size: 0.9em; border-top: 1px dashed #ddd5c9; padding-top: 30px;">
        <span style="color: #b0a8a0;">已经是第一篇了</span>
        <span style="color: #b0a8a0;">暂无下一篇</span>
    </div>
<!-- Giscus 评论区 -->
<div class="giscus-container">
    <div class="giscus-title">评论区</div>
            <!-- 悬浮阅读工具（整合字号与主题） -->
    <div class="floating-font-tool">
        <button id="font-toggle-btn" onclick="toggleFontPanel()">A</button>
        <div id="font-panel" class="font-panel" style="display: none;">
            <!-- 第一行：字号调节 -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
                <span>字号：</span>
                <button onclick="changeFontSize('small')" id="btn-small">小</button>
                <button onclick="changeFontSize('medium')" id="btn-medium" class="active">中</button>
                <button onclick="changeFontSize('large')" id="btn-large">大</button>
            </div>
            <!-- 第二行：黑夜模式切换 -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span>主题：</span>
                <button onclick="toggleTheme()" id="theme-btn">🌙 暗色</button>
            </div>
        </div>
    </div>
   <script src="https://giscus.app/client.js"
        data-repo="terasazutsukiyo/blog-comments"
        data-repo-id="R_kgDOUiQinQ"
        data-category="评论"
        data-category-id="DIC_kwDOUiQinc4DGAHp"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
    <!-- 上下篇翻页容器 -->
<div id="pagination-container"></div>

<a href="../index.html" class="back-link">← 返回作品目录</a>
    <!-- 引入 JS -->
    <script src="../script.js"></script
    <!-- 悬浮字体调节工具 -->
<div class="floating-font-tool">
    <button id="font-toggle-btn" onclick="toggleFontPanel()">A</button>
    <div id="font-panel" class="font-panel" style="display: none;">
        <span>字号：</span>
        <button onclick="changeFontSize('small')" id="btn-small">小</button>
        <button onclick="changeFontSize('medium')" id="btn-medium" class="active">中</button>
        <button onclick="changeFontSize('large')" id="btn-large">大</button>
    </div>
</div>                               
</body>
</html>
