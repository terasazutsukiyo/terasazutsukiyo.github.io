<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerasazuTsukiyo</title>
    <link rel="preconnect" href="https://fonts.font.im">
    <link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <div id="main-content">
        <!-- 头像与标题 -->
        <img src="avatar.jpg" alt="头像" class="profile-img">
        <h1>TerasazuTsukiyo</h1>
        <!-- 📢 公告栏 -->
        <div class="announcement-box">
            <div class="announcement-title">📢 公告栏</div>
            <div class="announcement-content">
                欢迎来到我的个人网站，现在只有基础框架，同人版块已加密，密码请见置顶，祝阅读愉快。
            </div>
        </div>
        <!-- 博客版块导航 -->
        <div class="category-nav">
            <span class="nav-item active" onclick="switchCategory('Blog')">Blog</span>
            <span class="nav-item" onclick="switchCategory('随笔')">随笔</span>
            <span class="nav-item" onclick="switchCategory('同人')">同人</span>
        </div>

        <!-- 书页容器 -->
        <div class="book-pages" id="book-pages">
            <div id="search-and-filter" style="display: none;">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索文章标题、CP或标签...">
                </div>
                <div class="filter-group" id="filter-group"></div>
            </div>

            <div id="fanfic-lock" style="display: none; text-align: center; padding: 50px 0;">
                <h2 style="color: #6b4c3a;">版块已加密</h2>
                <p style="color: #8b8b8b; margin-bottom: 20px;">请输入密码：</p>
                <input type="password" id="fanfic-password-input" placeholder="输入密码..." style="padding: 12px 20px; width: 250px; border: 1px solid #d1c3b4; border-radius: 30px; outline: none; text-align: center;">
                <br>
                <button onclick="checkFanficPassword()" style="margin-top: 20px; padding: 10px 30px; background-color: #6b4c3a; color: white; border: none; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 1em;">解锁</button>
                <p id="fanfic-error-msg" style="color: #8b3a3a; display: none; margin-top: 15px;">密码错误，请重试。</p>
            </div>

            <ul class="work-list" id="works-list"></ul>
        </div>

        <div class="disclaimer" style="margin-top: 40px;">
            本网站所有作品均为原创或二次创作，保留著作权，仅供个人欣赏交流，与版权方无关，严禁转载。
        </div>
    </div>

    <script src="script.js"></script>
        <!-- 悬浮阅读工具栏（直接放在这里，不用 JS 生成了） -->
    <div class="floating-font-tool">
        <button id="font-toggle-btn" onclick="toggleFontPanel()">A</button>
        <div id="font-panel" class="font-panel" style="display: none;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
                <span>字号：</span>
                <button onclick="changeFontSize('small')" id="btn-small">小</button>
                <button onclick="changeFontSize('medium')" id="btn-medium" class="active">中</button>
                <button onclick="changeFontSize('large')" id="btn-large">大</button>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span>主题：</span>
                <button onclick="toggleTheme()" id="theme-btn">暗色模式</button>
            </div>
        </div>
    </div>
</body>
</html>
