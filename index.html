<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerasazuTsukiyo</title>
    <link rel="preconnect" href="https://fonts.font.im">
    <link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <div id="main-content">
        <!-- 头像与标题 -->
        <img src="avatar.jpg" alt="头像" class="profile-img">
        <h1>TerasazuTsukiyo</h1>
                </div>
        <!-- 博客版块导航 -->
        <div class="category-nav">
            <span class="nav-item active" onclick="switchCategory('Blog')">Blog</span>
            <span class="nav-item" onclick="switchCategory('随笔')">随笔</span>
            <span class="nav-item" onclick="switchCategory('同人')">同人</span>
        </div>

        <!-- 书页容器 -->
        <div class="book-pages" id="book-pages">
            <div id="search-and-filter" style="display: none;">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索文章标题、CP或标签...">
                </div>
                <div class="filter-group" id="filter-group"></div>
            </div>

            <div id="fanfic-lock" style="display: none; text-align: center; padding: 50px 0;">
                <h2 style="color: #6b4c3a;">版块已加密</h2>
                <p style="color: #8b8b8b; margin-bottom: 20px;">请输入密码：</p>
                <input type="password" id="fanfic-password-input" placeholder="输入密码..." style="padding: 12px 20px; width: 250px; border: 1px solid #d1c3b4; border-radius: 30px; outline: none; text-align: center;">
                <br>
                <button onclick="checkFanficPassword()" style="margin-top: 20px; padding: 10px 30px; background-color: #6b4c3a; color: white; border: none; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 1em;">解锁</button>
                <p id="fanfic-error-msg" style="color: #8b3a3a; display: none; margin-top: 15px;">密码错误，请重试。</p>
            </div>

            <ul class="work-list" id="works-list"></ul>
        </div>

        <div class="disclaimer" style="margin-top: 40px;">
            本网站所有作品均为原创或二次创作，保留著作权，仅供个人欣赏交流，与版权方无关，严禁转载。
        </div>
    </div>
    <!-- 弹出式公告栏 (模态框) -->
    <div id="announcement-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">站点公告</span>
                <button class="modal-close" onclick="closeAnnouncement()">×</button>
            </div>
            <div class="modal-body">
                <p>欢迎来到我的同人书房！</p>
                <p>目前同人版块已加密，密码请私信获取。</p>
                <p>祝阅读愉快！</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" onclick="closeAnnouncement()">我知道了</button>
            </div>
        </div>
    </div>

                <!-- 公告栏控制逻辑 -->
    <script>
        //  【每次更新公告时，只需把 1.0 改成 1.1、1.2 即可重新弹出】
        const ANNOUNCEMENT_VERSION = "1.0"; 

        function openAnnouncement() {
            document.getElementById('announcement-modal').style.display = 'flex';
        }

        function closeAnnouncement() {
            document.getElementById('announcement-modal').style.display = 'none';
            // 把已读的版本号存入浏览器
            localStorage.setItem('announcement_read', ANNOUNCEMENT_VERSION);
        }

        // 页面加载时自动检查
        document.addEventListener('DOMContentLoaded', function() {
            const readVersion = localStorage.getItem('announcement_read');
            // 如果当前版本号与已读版本号不一致，延迟 1 秒后自动弹出
            if (readVersion !== ANNOUNCEMENT_VERSION) {
                setTimeout(openAnnouncement, 1000);
            }
        });
    </script>
    <!-- 折叠式侧边栏阅读工具 -->
    <div class="sidebar-tool">
        <div class="sidebar-panel" id="sidebar-panel" style="display: none;">
            <div class="sidebar-header">阅读工具</div>
            <div class="tool-item">
                <span class="tool-label">字号</span>
                <div class="tool-btn-group">
                    <button onclick="changeFontSize('small')" id="btn-small">小</button>
                    <button onclick="changeFontSize('medium')" id="btn-medium" class="active">中</button>
                    <button onclick="changeFontSize('large')" id="btn-large">大</button>
                </div>
            </div>
            <div class="tool-item">
                <span class="tool-label">主题</span>
                <button onclick="toggleTheme()" id="theme-btn" class="tool-btn">暗色模式</button>
            </div>
               </div>
        <div class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </div>
    </div>
       </div>
</body>
</html>
<script src="script.js"></script>
